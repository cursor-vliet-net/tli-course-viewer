<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-labelledby="t">
  <title id="t">CEFR ladder A1 to C2</title>
  <rect width="360" height="300" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle">
    <rect x="20"  y="240" width="50" height="40"  fill="#cfe2ff" stroke="#084298"/><text x="45"  y="266" font-size="18" fill="#052c65">A1</text>
    <rect x="75"  y="205" width="50" height="75"  fill="#9ec5fe" stroke="#084298"/><text x="100" y="231" font-size="18" fill="#052c65">A2</text>
    <rect x="130" y="170" width="50" height="110" fill="#a3cfbb" stroke="#0a3622"/><text x="155" y="196" font-size="18" fill="#0a3622">B1</text>
    <rect x="185" y="135" width="50" height="145" fill="#75b798" stroke="#0a3622"/><text x="210" y="161" font-size="18" fill="#0a3622">B2</text>
    <rect x="240" y="100" width="50" height="180" fill="#ffe69c" stroke="#664d03"/><text x="265" y="126" font-size="18" fill="#332701">C1</text>
    <rect x="295" y="65"  width="50" height="215" fill="#ffda6a" stroke="#664d03"/><text x="320" y="91"  font-size="18" fill="#332701">C2</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#212529">
    <text x="72" y="190" text-anchor="middle">Basic user</text>
    <text x="182" y="120" text-anchor="middle">Independent user</text>
    <text x="292" y="50" text-anchor="middle">Proficient user</text>
    <text x="20" y="26" font-size="16" font-weight="bold">CEFR levels</text>
  </g>
</svg>
