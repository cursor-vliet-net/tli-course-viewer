<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="t">
  <title id="t">Pilot decision flow</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
  <rect width="640" height="220" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#212529">
    <rect x="20" y="80" width="170" height="60" rx="8" fill="#e2e3e5" stroke="#495057"/>
    <text x="105" y="105">Who can YWAM</text><text x="105" y="123">gather in 1–3 months?</text>
    <rect x="260" y="20" width="160" height="56" rx="8" fill="#cfe2ff" stroke="#084298"/>
    <text x="340" y="44">Community adults</text><text x="340" y="62">→ adult spheres first</text>
    <rect x="260" y="144" width="160" height="56" rx="8" fill="#d1e7dd" stroke="#0a3622"/>
    <text x="340" y="168">School learners</text><text x="340" y="186">→ school material first</text>
    <rect x="480" y="80" width="140" height="60" rx="8" fill="#fff3cd" stroke="#664d03"/>
    <text x="550" y="105">Same CEFR</text><text x="550" y="123">can-do outcomes</text>
  </g>
  <g stroke="#495057" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M190,100 L258,52"/><path d="M190,120 L258,170"/>
    <path d="M420,52 L478,98"/><path d="M420,170 L478,124"/>
  </g>
</svg>
